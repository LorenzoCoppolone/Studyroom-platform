<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> StudyRoom | Login</title>
    <!-- favicon -->
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
    <!-- Link allo stile css -->
    <link rel="stylesheet" href="../CSS/styleForm.css">
    <!-- Icone -->
    <link rel='stylesheet' href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css'>
</head>
<body>
    <div class="form-login-container">
        <a href="home.html" target="_self">
            <img src="../img/logo.png" alt="Logo StudyRoom" class="logo-form-login">
        </a>
        <form action = "#">
            <h2>Login</h2>
            <div class="campo-input">
                <input type="text" placeholder="Email" required>
                <i class="bx bx-envelope" ></i>
            </div>
            <div class="campo-input">
                <input type="password" placeholder="Password" required>
                <i class="bx bx-lock"></i>
            </div>
            <div class="Ricordami">
                <label for="controllo"><input type="checkbox" 
                id="controllo"> Ricordami</label>
                <a href="#">Hai dimenticato la password?</a>
            </div>
            <button class = "btn" type="submit">Accedi</button>
            <div class="registrazione">
                <p>Non hai un account? <a href="registrationForm.html">Registrati</a></p>
            </div>
        </form>      
    </div>
</body>
</html>
