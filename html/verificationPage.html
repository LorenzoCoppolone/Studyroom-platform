<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title> StudyRoom |Verifica registrazione</title>
  <link rel="stylesheet" href="styleEmailPages.css" />
</head>
<body>
    <div class="pagina-verifica">
        <h1 class="title">Verifica registrazione</h1>
        <p class="subtitle">
            Ti abbiamo inviato un link di conferma.<br />
            Apri la tua casella di posta e clicca sul link per 
            confermare la registrazione .
        </p>
        <div class="divider"></div>

        <p class="hint">
            Non hai ricevuto nulla?
        <button class="resend-btn" id="resendBtn">Invia di nuovo</button>
        </p>
        <p class="spam-note">Controlla anche la cartella
         <strong>Spam</strong> o <strong>Posta indesiderata</strong>.</p>
 </div>
</body>
</html>
